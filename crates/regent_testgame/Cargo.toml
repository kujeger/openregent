# run the real simulation. Every crate's tests take it as a dev-dependency.
[package]
name = "regent_testgame"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "A made-up game for tests that have no Majesty data"

[dependencies]
regent_core = { path = "../regent_core" }

