# The library: readers for the data files, the GPL language and VM, the
# simulation, and what the screen shows of it, in acyclic layers (src/lib.rs).
#
# Four dependencies, readable off this one file — which is the reason the
# binaries are separate crates rather than extra targets here.
[package]
name = "regent_core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Readers for Majesty: The Fantasy Kingdom Sim (2000), its GPL compiler and VM, and its simulation"

[dependencies]
ariadne = "0.6.0"
logos = "0.16.1"
# The save model only (`save`).
serde = { workspace = true }
toml = "1.2.0"

# Only the tests read XML (the SDK's descriptor files, the oracle the
# offsets are solved against) and PNG captures.
[dev-dependencies]
# The `PICT` videos decode (`tests/video.rs`).
bink = { path = "../bink" }
# The corpus lookup (`tests/common`).
regent_corpus = { path = "../regent_corpus" }
# The made-up game (`tests/test_game.rs`).
regent_testgame = { path = "../regent_testgame" }
# The address check (`tests/addresses.rs`).
regex = "1"
roxmltree = "0.21"
png = { workspace = true }
# The save tests: a snapshot as RON, packed as openregent packs it.
ron = "0.12"
zstd = "0.14"
tempfile = "3.27.0"

[lib]
name = "regent_core"
path = "src/lib.rs"

[features]
# Test tier: `install` needs the game's files. Without it `cargo test`
# needs no game data.
install = []

[[test]]
name = "animate"
required-features = ["install"]

