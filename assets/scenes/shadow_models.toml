# A Warriors Guild and a level 2 Guardhouse with shadow models, and a
# warrior in the Guild's shadow: a check of `[enhancements] cast`.
#
#   tools/shot.sh target/debug/openregent out.png --scene assets/scenes/shadow_models.toml --look 61,61 --cast models
version = 1
map = { flat = { side = 128 } }

[[unit]]
code = "ABV1" # Warriors_Guild
at = [60, 60]

[[unit]]
code = "ABE2" # Guardhouse2
at = [67, 63]

[[unit]]
code = "AVL1" # Warrior
at = [56, 60]
